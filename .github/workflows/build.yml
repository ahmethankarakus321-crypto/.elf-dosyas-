name: PS2 ELF Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build PS2 Project
        run: make

      - name: Upload ELF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ps2-executable
          path: |
            *.elf
            **/*.elf
            
