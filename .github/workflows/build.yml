name: PS2 ELF Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:latest
    env:
      PS2DEV: /usr/local/ps2dev
      PS2SDK: /usr/local/ps2sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Make in Container
        run: |
          apk update && apk add make || apt-get update && apt-get install -y make

      - name: Build PS2 Project
        run: |
          export PATH=$PS2DEV/bin:$PS2SDK/bin:$PATH
          make

      - name: Upload ELF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ps2-executable
          path: |
            *.elf
            **/*.elf
            
