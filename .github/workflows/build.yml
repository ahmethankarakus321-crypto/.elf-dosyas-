name: PS2 ELF Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential make git

      - name: Build PS2 Project
        run: |
          # Eğer özel bir PS2DEV ortamı kullanıyorsan yolları buraya ekleyebilirsin
          make

      - name: Upload ELF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ps2-executable
          path: |
            *.elf
            **/*.elf
            
